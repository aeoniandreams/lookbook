<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lookbook · 페어 의상 갤러리</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- 비밀번호 입장 화면 -->
<div id="authGate" class="auth-gate">
  <div class="auth-box">
    <i data-lucide="lock"></i>
    <h1>Lookbook</h1>
    <p>비밀번호를 입력하면 갤러리를 볼 수 있어요.</p>
    <input type="password" id="authPasswordInput" placeholder="비밀번호" autocomplete="current-password">
    <button id="authSubmitBtn" class="primary-btn">입장하기</button>
    <p id="authError" class="auth-error hidden"></p>
  </div>
</div>

<div id="app" class="hidden">
  <button id="sidebarToggle" class="icon-btn mobile-only" aria-label="메뉴 열기">
    <i data-lucide="menu"></i>
  </button>

  <aside id="sidebar">
    <div class="sidebar-header">
      <i data-lucide="sparkles" class="brand-icon"></i>
      <span class="brand-name">Lookbook</span>
    </div>
    <nav id="categoryNav"></nav>
  </aside>

  <div id="sidebarScrim" class="hidden"></div>

  <main id="main">
    <header id="contentHeader">
      <div class="breadcrumb" id="breadcrumb"></div>
      <button id="addBlockBtn" class="primary-btn icon-only" aria-label="카드 추가">
        <i data-lucide="plus"></i>
      </button>
    </header>

    <section id="blockGrid" class="grid"></section>

    <div id="emptyState" class="empty-state hidden">
      <i data-lucide="image-plus"></i>
      <p>아직 등록된 카드가 없어요.</p>
      <button id="emptyAddBtn" class="primary-btn">
        <i data-lucide="plus"></i> 첫 카드 추가하기
      </button>
    </div>
  </main>
</div>

<!-- 카드 상세 보기 모달 -->
<div id="viewModal" class="modal-overlay hidden">
  <div class="modal view-modal">
    <button class="modal-close" data-close-view><i data-lucide="x"></i></button>
    <div class="view-body">
      <div class="view-meta" id="viewMeta"></div>
      <h2 id="viewTitle"></h2>
      <p id="viewContent"></p>
      <div class="view-actions">
        <button id="viewEditBtn" class="secondary-btn"><i data-lucide="pencil"></i> 수정</button>
        <button id="viewDeleteBtn" class="danger-btn"><i data-lucide="trash-2"></i> 삭제</button>
      </div>
      <div class="view-gallery" id="viewGallery"></div>
    </div>
  </div>
</div>

<!-- 카드 추가/수정 모달 -->
<div id="editModal" class="modal-overlay hidden">
  <div class="modal edit-modal">
    <button class="modal-close" data-close-edit><i data-lucide="x"></i></button>
    <h2 id="editModalTitle">새 카드 추가</h2>

    <div class="field-row">
      <div class="field">
        <label>1차 카테고리</label>
        <select id="editCategorySelect"></select>
      </div>
      <div class="field">
        <label>2차 카테고리</label>
        <select id="editSubcategorySelect"></select>
      </div>
    </div>

    <div class="field">
      <label>제목</label>
      <input type="text" id="editTitleInput" placeholder="카드 제목을 입력하세요" maxlength="100">
    </div>

    <div class="field">
      <label>이미지</label>
      <div class="image-url-row">
        <input type="url" id="editImageUrlInput" placeholder="이미지 주소(URL)를 붙여넣으세요">
        <button type="button" id="editImageUrlAddBtn" class="secondary-btn"><i data-lucide="plus"></i> 추가</button>
      </div>
      <p class="hint">별 아이콘으로 썸네일(최대 2개)을 고르고, 이미지 사이의 연결 버튼으로 나란히 보여줄 이미지를 묶을 수 있어요.</p>
      <div id="editImageGrid" class="image-manage-grid"></div>
    </div>

    <div class="field">
      <label>내용</label>
      <textarea id="editContentInput" rows="6" placeholder="설정, 메모, 디자인 노트 등을 자유롭게 적어주세요"></textarea>
    </div>

    <div class="edit-actions">
      <button id="editCancelBtn" class="secondary-btn">취소</button>
      <button id="editSaveBtn" class="primary-btn"><i data-lucide="check"></i> 저장</button>
    </div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script src="js/vendor/lucide.min.js"></script>
<script>lucide.createIcons();</script>
<script src="js/firebase-config.js"></script>
<script type="module" src="js/firebase-init.js"></script>
<script src="js/data.js" defer></script>
<script src="js/app.js" defer></script>
<script>
  // firebase-init.js가 아예 실행되지 못한 경우(네트워크 차단, 스크립트 로드
  // 실패 등) 입장 버튼을 눌러도 반응이 없고 에러 메시지도 뜨지 않는다.
  // 이런 "조용한 실패"를 감지해서 안내 문구를 보여준다.
  setTimeout(function () {
    if (window.LookbookFirebase) return;
    var authError = document.getElementById('authError');
    if (!authError || !authError.classList.contains('hidden')) return;
    authError.textContent =
      'Firebase 스크립트를 불러오지 못했어요. 인터넷 연결, 광고 차단/보안 확장 프로그램, 방화벽을 확인한 뒤 새로고침해주세요. (F12 개발자 도구 → Console 탭에서 자세한 오류를 확인할 수 있어요)';
    authError.classList.remove('hidden');
  }, 4000);
</script>
</body>
</html>
